name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Query GitHub API for the latest release tag (authoritative, includes API-created tags)
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          # Strip leading 'v' and split
          VERSION_CORE="${LATEST#v}"
          MAJOR="${VERSION_CORE%%.*}"
          REST="${VERSION_CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          # Bump patch
          PATCH=$((PATCH + 1))
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
          GOPRIVATE: github.com/cosmin-harangus/go-bpmn-engine
        run: |
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          mkdir -p dist
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="dist/go-bpmn-server_${GOOS}_${GOARCH}"
            echo "Building ${GOOS}/${GOARCH}..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${output}" \
              ./cmd/server
          done

      - name: Bundle archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          mkdir -p dist/archives
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            binary="dist/go-bpmn-server_${GOOS}_${GOARCH}"
            archive="dist/archives/go-bpmn-server_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            tar -czf "${archive}" \
              -C dist "go-bpmn-server_${GOOS}_${GOARCH}" \
              -C .. README.md .env.example
            echo "Created ${archive}"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          gh release create "${VERSION}" \
            --title "Release ${VERSION} (${SHORT_SHA})" \
            --notes "$(cat <<EOF
          ## go-bpmn-server ${VERSION}

          Built from commit \`${SHORT_SHA}\` on $(date -u +%Y-%m-%d).

          ### Quick start

          1. Download the binary for your platform
          2. Copy \`.env.example\` to \`.env\` and fill in your values
          3. Run: \`DATABASE_URL=... ./go-bpmn-server\`

          See [README.md](https://github.com/cosmin-harangus/go-bpmn-server/blob/main/README.md) for full setup instructions.
          EOF
          )" \
            dist/archives/*.tar.gz
